<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain主页</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    background:#e6f4ff;
    text-align:center;
    padding-top:80px;
    font-family: system-ui, sans-serif;
}
/* 第一行绿色标题 */
.title-green{
    color:#009929;
    font-size:30px;
    font-weight:bold;
}
/* 欢迎文字 */
.welcome{
    font-size:22px;
    color:#1a1a1a;
    margin:12px 0 35px;
}
/* 天气文字样式 */
.weather-box{
    font-size:19px;
    color:#2b2b2b;
    line-height:1.8;
}
/* 刷新按钮样式 */
#refreshBtn{
    margin-top:15px;
    padding:6px 16px;
    border:none;
    border-radius:6px;
    background:#0969da;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}
#refreshBtn:active{
    background:#0757b9;
}
</style>
</head>
<body>
    <p class="title-green">hello I am Rain</p>
    <p class="welcome">欢迎回来</p>

    <div class="weather-box" id="weatherText">
        正在加载大同实时天气 ···
    </div>
    <button id="refreshBtn" style="display:none" onclick="loadWeather()">重新加载天气</button>

<script>
// 加载天气函数
function loadWeather(){
    document.getElementById('weatherText').innerText = "正在加载大同实时天气 ···";
    document.getElementById('refreshBtn').style.display = "none";
    // 移除旧的script标签，防止重复请求
    let oldScript = document.getElementById('weatherScript');
    if(oldScript) oldScript.remove();
    // JSONP跨域请求天气
    let script = document.createElement('script');
    script.id = 'weatherScript';
    script.src = 'https://wthrcdn.etouch.cn/WeatherApi?city=大同&callback=getWeatherData';
    document.body.appendChild(script);
}
// 接口回调函数，接收实时天气数据
function getWeatherData(res){
    let info = res.weatherinfo;
    let html = `大同实时天气：${info.weather}<br>温度：${info.temp}℃ | 湿度：${info.humidity}<br>风向风力：${info.wind} ${info.wind_level}`;
    document.getElementById('weatherText').innerHTML = html;
}
// 全局捕获接口超时/失败
window.onerror = function(){
    document.getElementById('weatherText').innerText = "天气数据加载失败";
    document.getElementById('refreshBtn').style.display = "block";
}
// 页面打开自动加载
window.onload = loadWeather;
</script>
</body>
</html>
