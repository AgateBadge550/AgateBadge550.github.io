<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain主页</title>
<style>
body{
background:#e6f4ff;
text-align:center;
margin-top:60px;
}
/* 第一行绿色文字 */
.green-text{
color:green;
font-size:28px;
}
/* 第二行欢迎文字 */
.wel{
font-size:20px;
}
/* 天气文字，无任何边框/白色小框 */
.weather-text{
margin-top:20px;
font-size:18px;
color:#222;
}
</style>
</head>
<body>
<p class="green-text">hello I am Rain</p>
<p class="wel">欢迎回来</p>

<!-- 纯文字大同天气，无盒子、无白框 -->
<div class="weather-text" id="weather">
正在加载大同天气...
</div>

<script>
// 调用免费文字天气接口，仅输出文字
fetch('https://wttr.in/Datong?format=大同实时天气：%C 温度：%t 湿度：%h 风力：%w')
.then(res=>res.text())
.then(data=>{
document.getElementById('weather').innerText = data;
})
.catch(()=>{
document.getElementById('weather').innerText = "天气加载失败，刷新页面重试";
})
</script>
</body>
</html>
