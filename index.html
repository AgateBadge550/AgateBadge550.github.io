<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wttr.in — Weather Report</title>
<link rel="stylesheet" type="text/css"
href="https://adobe-fonts.github.io/source-code-pro/source-code-pro.css">
<style>
html, body {
margin: 0;
padding: 0;
background: #ffe6cc;
height: 100%;
overflow: auto;
display: flex;
justify-content: center;
padding-top: 80px;
}
.term-container {
background: #ffe6cc;
color: #333333;
font-family: "Source Code Pro",
"DejaVu Sans Mono",
Menlo,
"Lucida Sans Typewriter",
"Lucida Console",
monaco,
"Bitstream Vera Sans Mono",
monospace;
font-size: 11.8px;
line-height: 1.30 !important;
letter-spacing: 0.00em;
padding: 6px 10px 0px 10px;
white-space: pre;
word-break: normal;
overflow-wrap: normal;
margin: 0;
max-width: 100%;
width: fit-content;
display: block;
box-sizing: border-box;
}
.term-fg1, .bold {
color: #111111;
}
.green-text {
color: #009929;
font-size: 18px;
display:block;
margin-bottom:8px;
}
.welcome-text {
color: #222222;
font-size: 16px;
display:block;
margin-bottom:20px;
}
/* 实时天气独立区块 */
.now-box{
border:1px solid #ffb380;
width:360px;
padding:12px;
margin:5px 0;
}
/* 明日预报独立区块 */
.tom-box{
border:1px solid #ffb380;
width:360px;
padding:12px;
margin-top:10px;
}
</style>
</head>
<body>
<div class="term-container">
<span class="green-text">hello I am Rain</span>
<span class="welcome-text">欢迎回来</span>
--------------------------
大同实时天气：
<div class="now-box" id="nowWeather">加载中实时天气...</div>

大同明日预报：
<div class="tom-box" id="tomWeather">加载中明日预报...</div>
</div>

<script>
// JSONP跨域请求，不会404，自带今日+明天天气
function weatherCallback(res) {
    let info = res.weatherinfo;
    // 实时天气文字
    let nowStr = `天气：${info.weather}
温度：${info.temp}℃
湿度：${info.humidity}
风力：${info.wind}${info.wind_level}`;
    document.getElementById("nowWeather").innerText = nowStr;

    // 明日预报文字
    let tomorrowStr = `明日天气：${info.weather1}
气温区间：${info.temp1}
风向风力：${info.wind1}${info.wind_level1}`;
    document.getElementById("tomWeather").innerText = tomorrowStr;
}
// 动态创建script绕过跨域，无iframe，杜绝404页面
let script = document.createElement('script');
script.src = 'https://wthrcdn.etouch.cn/WeatherApi?city=大同&callback=weatherCallback';
document.body.appendChild(script);
// 加载失败兜底提示
window.onerror = function(){
    document.getElementById("nowWeather").innerText = "天气加载失败，请切换流量刷新";
    document.getElementById("tomWeather").innerText = "预报加载失败，请切换流量刷新";
}
</script>
</body>
</html>
