<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain主页</title>
<style>
body{
background:#e6f4ff;
text-align:center;
margin-top:60px;
}
.green-text{
color:green;
font-size:28px;
}
.wel{
font-size:20px;
}
.weather-info{
margin-top:20px;
font-size:18px;
color:#333;
background:#fff;
width:300px;
padding:15px;
border-radius:12px;
box-shadow:0 2px 8px #ccc;
margin-left:auto;
margin-right:auto;
}
</style>
</head>
<body>
<p class="green-text">hello I am Rain</p>
<p class="wel">欢迎回来</p>

<!-- 纯文字大同天气区域 -->
<div class="weather-info" id="weather">
正在加载大同天气...
</div>

<script>
// 大同城市ID 101100201
fetch('https://wttr.in/Datong?format=大同天气：%C %t 湿度：%h 风速：%w')
.then(res=>res.text())
.then(data=>{
document.getElementById('weather').innerText = data;
})
.catch(()=>{
document.getElementById('weather').innerText = "天气加载失败，请稍后刷新";
})
</script>
</body>
</html>
